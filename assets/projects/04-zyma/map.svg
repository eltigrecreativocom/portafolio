<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-map" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1a3f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a2a5f;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#grad-map)"/>
  
  <text x="600" y="50" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#fff">GPS TRACKING</text>
  
  <rect x="100" y="100" width="1000" height="600" fill="#1a3a4a" stroke="#8e44ad" stroke-width="2" rx="8"/>
  
  <!-- Mapa grid -->
  <line x1="100" y1="250" x2="1100" y2="250" stroke="#8e44ad" stroke-width="1" opacity="0.2"/>
  <line x1="100" y1="400" x2="1100" y2="400" stroke="#8e44ad" stroke-width="1" opacity="0.2"/>
  <line x1="350" y1="100" x2="350" y2="700" stroke="#8e44ad" stroke-width="1" opacity="0.2"/>
  <line x1="600" y1="100" x2="600" y2="700" stroke="#8e44ad" stroke-width="1" opacity="0.2"/>
  <line x1="850" y1="100" x2="850" y2="700" stroke="#8e44ad" stroke-width="1" opacity="0.2"/>
  
  <!-- Markers -->
  <circle cx="350" cy="200" r="8" fill="#27ae60" stroke="#fff" stroke-width="2"/>
  <text x="350" y="240" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">Juan</text>
  <text x="350" y="258" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">$2,450</text>
  
  <circle cx="600" cy="300" r="8" fill="#27ae60" stroke="#fff" stroke-width="2"/>
  <text x="600" y="340" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">Maria</text>
  <text x="600" y="358" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">$3,120</text>
  
  <circle cx="850" cy="450" r="8" fill="#f39c12" stroke="#fff" stroke-width="2"/>
  <text x="850" y="490" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#f39c12">Carlos</text>
  <text x="850" y="508" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">$1,890</text>
  
  <circle cx="280" cy="550" r="8" fill="#27ae60" stroke="#fff" stroke-width="2"/>
  <text x="280" y="590" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#27ae60">Pedro</text>
  <text x="280" y="608" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#fff">$2,780</text>
  
  <!-- Legend -->
  <circle cx="1050" cy="720" r="4" fill="#27ae60"/>
  <text x="1070" y="725" font-family="Arial, sans-serif" font-size="12" fill="#27ae60">Activo</text>
  
  <circle cx="1050" cy="745" r="4" fill="#f39c12"/>
  <text x="1070" y="750" font-family="Arial, sans-serif" font-size="12" fill="#f39c12">Inactivo</text>
</svg>
