<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a3a4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d5a6f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ba3d0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a7ba0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#grad2)"/>
  <rect width="1200" height="100" fill="url(#accent2)"/>
  <text x="600" y="65" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#fff">RSVP SYSTEM</text>
  
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="56" font-weight="bold" text-anchor="middle" fill="#fff">Sistema de Confirmación</text>
  
  <g id="steps">
    <circle cx="200" cy="400" r="40" fill="#2ba3d0" opacity="0.3" stroke="#2ba3d0" stroke-width="2"/>
    <text x="200" y="410" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#2ba3d0">1</text>
    <text x="200" y="480" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">Enviar</text>
    
    <line x1="280" y1="400" x2="520" y2="400" stroke="#2ba3d0" stroke-width="2" opacity="0.5"/>
    
    <circle cx="600" cy="400" r="40" fill="#2ba3d0" opacity="0.3" stroke="#2ba3d0" stroke-width="2"/>
    <text x="600" y="410" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#2ba3d0">2</text>
    <text x="600" y="480" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">Confirmar</text>
    
    <line x1="680" y1="400" x2="920" y2="400" stroke="#2ba3d0" stroke-width="2" opacity="0.5"/>
    
    <circle cx="1000" cy="400" r="40" fill="#2ba3d0" opacity="0.3" stroke="#2ba3d0" stroke-width="2"/>
    <text x="1000" y="410" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#2ba3d0">3</text>
    <text x="1000" y="480" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#fff">Seguimiento</text>
  </g>
  
  <rect y="650" width="1200" height="150" fill="url(#accent2)" opacity="0.1"/>
  <text x="600" y="710" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2ba3d0" font-weight="bold">Plugin Personalizado WordPress</text>
</svg>
