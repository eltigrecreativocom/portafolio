<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-elyon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f5f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0f0e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#229954;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad-elyon)"/>
  
  <!-- Top bar with logo -->
  <rect width="1200" height="90" fill="#fff" stroke="url(#accent-green)" stroke-width="3"/>
  <circle cx="100" cy="45" r="30" fill="url(#accent-green)"/>
  <text x="150" y="55" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#27ae60">
    ELYON NATURAL
  </text>
  
  <!-- Main title -->
  <text x="600" y="200" font-family="Arial, sans-serif" font-size="52" font-weight="bold" text-anchor="middle" fill="#229954">
    Suplementos Naturales
  </text>
  
  <text x="600" y="260" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#555">
    Tienda virtual + Herramienta interna de catálogo
  </text>
  
  <!-- Product showcase cards -->
  <g id="products">
    <!-- Card 1 -->
    <rect x="100" y="320" width="320" height="200" fill="#fff" stroke="#27ae60" stroke-width="2" rx="8"/>
    <rect x="110" y="330" width="300" height="90" fill="url(#accent-green)" opacity="0.2"/>
    <text x="260" y="400" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Catálogo de Productos</text>
    <text x="260" y="445" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">Base de datos completa</text>
    
    <!-- Card 2 -->
    <rect x="490" y="320" width="320" height="200" fill="#fff" stroke="#27ae60" stroke-width="2" rx="8"/>
    <rect x="500" y="330" width="300" height="90" fill="url(#accent-green)" opacity="0.2"/>
    <text x="650" y="400" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Validación EAN-13</text>
    <text x="650" y="445" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">Escaneo de códigos</text>
    
    <!-- Card 3 -->
    <rect x="880" y="320" width="320" height="200" fill="#fff" stroke="#27ae60" stroke-width="2" rx="8"/>
    <rect x="890" y="330" width="300" height="90" fill="url(#accent-green)" opacity="0.2"/>
    <text x="1040" y="400" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#333">Registros Sanitarios</text>
    <text x="1040" y="445" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#666">Información regulatoria</text>
  </g>
  
  <!-- Footer bar -->
  <rect y="590" width="1200" height="85" fill="url(#accent-green)" opacity="0.15"/>
  <text x="600" y="640" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#27ae60" font-weight="bold">
    WordPress + WooCommerce + Herramientas internas personalizadas
  </text>
</svg>
