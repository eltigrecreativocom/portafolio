<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad-cronos" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d0e8f2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2ba3d0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a7ba0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="675" fill="url(#grad-cronos)"/>
  
  <!-- Top banner -->
  <rect width="1200" height="80" fill="url(#accent-blue)"/>
  <text x="600" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="#fff">
    CRONOS
  </text>
  
  <!-- Main content -->
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="48" font-weight="bold" text-anchor="middle" fill="#1a7ba0">
    Quiénes Somos
  </text>
  
  <text x="600" y="250" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#555" max-width="900">
    Editorial especializada en textos escolares personalizados
  </text>
  
  <!-- Feature grid -->
  <g id="features-cronos">
    <rect x="120" y="320" width="280" height="140" fill="#fff" stroke="#2ba3d0" stroke-width="2" rx="8"/>
    <circle cx="260" cy="360" r="20" fill="#2ba3d0"/>
    <text x="260" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Educación Personalizada</text>
    
    <rect x="460" y="320" width="280" height="140" fill="#fff" stroke="#2ba3d0" stroke-width="2" rx="8"/>
    <circle cx="600" cy="360" r="20" fill="#2ba3d0"/>
    <text x="600" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Acceso Protegido</text>
    
    <rect x="800" y="320" width="280" height="140" fill="#fff" stroke="#2ba3d0" stroke-width="2" rx="8"/>
    <circle cx="940" cy="360" r="20" fill="#2ba3d0"/>
    <text x="940" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Plugin WordPress</text>
  </g>
  
  <!-- Bottom section -->
  <rect y="550" width="1200" height="125" fill="url(#accent-blue)" opacity="0.1"/>
  <text x="600" y="620" font-family="Arial, sans-serif" font-size="18" text-anchor="middle" fill="#2ba3d0" font-weight="bold">
    Sistema de permisos y protección de contenido educativo
  </text>
</svg>
